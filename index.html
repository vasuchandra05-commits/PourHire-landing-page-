<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PourHire — Baristas and cafes, matched</title>
<style>
  :root {
    --brown: #3B2314;
    --tan: #6B4226;
    --cream: #F5EFE6;
    --line: rgba(255,255,255,0.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--cream);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }
  .side {
    position: relative;
    height: 100%;
    overflow: hidden;
    transition: flex-basis 0.45s cubic-bezier(.22,.61,.36,1), filter 0.45s ease;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .side.left {
    flex-basis: 50%;
    background: radial-gradient(circle at 30% 30%, #5a3620, var(--brown));
  }
  .side.right {
    flex-basis: 50%;
    background: radial-gradient(circle at 70% 30%, #4a2f1c, #241209);
  }
  .side::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.05) 40%);
  }
  .side .icon {
    position: relative;
    z-index: 2;
    font-size: 9rem;
    opacity: 0.18;
    margin-bottom: -2rem;
    user-select: none;
  }
  .tag {
    position: absolute;
    z-index: 3;
    color: var(--cream);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 6px 14px;
    border: 1px solid rgba(245,239,230,0.4);
    border-radius: 999px;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(3px);
    white-space: nowrap;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .seam {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 2px;
    transform: translateX(-1px);
    background: var(--line);
    box-shadow: 0 0 18px 2px rgba(255,255,255,0.6);
    z-index: 5;
    transition: left 0.45s cubic-bezier(.22,.61,.36,1);
    pointer-events: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    padding: 0 20px;
  }
  .overlay * { pointer-events: auto; }
  .wordmark {
    color: var(--cream);
    font-size: 1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 18px;
    animation: fadeIn 1s ease forwards;
    animation-delay: 0.2s;
    opacity: 0;
  }
  .headline {
    color: var(--cream);
    font-size: clamp(1.8rem, 4.2vw, 3.2rem);
    font-weight: 600;
    line-height: 1.15;
    max-width: 780px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.4);
    animation: fadeIn 1s ease forwards;
    animation-delay: 0.5s;
    opacity: 0;
  }
  .subhead {
    color: var(--cream);
    opacity: 0;
    font-size: 1rem;
    margin-top: 14px;
    max-width: 520px;
    line-height: 1.5;
    animation: fadeIn 1s ease forwards;
    animation-delay: 0.8s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .buttons {
    margin-top: 34px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 1.1s;
  }
  .btn {
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: 1.5px solid var(--cream);
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.primary { background: var(--cream); color: var(--brown); }
  .btn.primary:hover { background: #fff; }
  .btn.ghost { background: transparent; color: var(--cream); }
  .btn.ghost:hover { background: rgba(245,239,230,0.12); }

  @media (max-width: 720px) {
    .stage { flex-direction: column; }
    .side.left, .side.right { flex-basis: 50% !important; }
    .seam {
      top: 50%; left: 0; right: 0; bottom: auto;
      width: 100%; height: 2px;
      transform: translateY(-1px);
    }
    .side .icon { font-size: 5.5rem; }
    .tag { font-size: 0.68rem; padding: 5px 10px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="side left" id="leftSide" data-role="barista">
    <div class="tag" style="top:18%; left:14%;">Latte Art</div>
    <div class="tag" style="top:32%; right:12%;">3 yrs experience</div>
    <div class="tag" style="bottom:28%; left:20%;">Espresso</div>
    <div class="icon">☕</div>
  </div>
  <div class="side right" id="rightSide" data-role="cafe">
    <div class="tag" style="top:20%; left:16%;">Hiring Now</div>
    <div class="tag" style="top:34%; right:14%;">Full-time</div>
    <div class="tag" style="bottom:26%; right:18%;">Gurgaon</div>
    <div class="icon">🏠</div>
  </div>
  <div class="seam" id="seam"></div>

  <div class="overlay">
    <div class="wordmark">PourHire</div>
    <div class="headline">Baristas and cafes,<br />matched — without the guesswork.</div>
    <div class="subhead">Verified barista profiles. Real cafe openings. We handle the match so both sides can trust it.</div>
    <div class="buttons">
      <a href="#" class="btn primary" id="baristaBtn">I'm a Barista</a>
      <a href="#" class="btn ghost" id="cafeBtn">I'm Hiring</a>
    </div>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const left = document.getElementById('leftSide');
  const right = document.getElementById('rightSide');
  const seam = document.getElementById('seam');
  const isMobile = () => window.innerWidth <= 720;

  function setSplit(ratio) {
    // ratio: 0 (full left) to 1 (full right), 0.5 = even
    ratio = Math.min(0.72, Math.max(0.28, ratio));
    left.style.flexBasis = (ratio * 100) + '%';
    right.style.flexBasis = ((1 - ratio) * 100) + '%';
    if (!isMobile()) {
      seam.style.left = (ratio * 100) + '%';
    }
  }

  stage.addEventListener('mousemove', (e) => {
    if (isMobile()) return;
    const ratio = e.clientX / window.innerWidth;
    setSplit(ratio);
  });

  stage.addEventListener('mouseleave', () => {
    if (isMobile()) return;
    setSplit(0.5);
  });

  // Touch support: tap a side to emphasize it briefly
  [left, right].forEach((el) => {
    el.addEventListener('touchstart', () => {
      if (!isMobile()) return;
      el.style.filter = 'brightness(1.08)';
      setTimeout(() => { el.style.filter = ''; }, 300);
    });
  });

  // Buttons — replace these hrefs with your real Glide app URLs
  document.getElementById('baristaBtn').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'https://your-glide-app-url.com/barista-signup';
  });
  document.getElementById('cafeBtn').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'https://your-glide-app-url.com/cafe-signup';
  });
</script>

</body>
</html>
